# NFL Stadium Wallet — Unified Documentation
# Red Hat–inspired branding for GitHub Pages
title: "NFL Stadium Wallet"
description: "Centralized digital wallet for NFL stadiums — Architecture, GitOps, Service Mesh, Observability & Testing Guide"
baseurl: "/nfl-wallet-docs"
url: "https://maximilianopizarro.github.io"
github_repo: "https://github.com/maximilianopizarro/NFL-Wallet"
github_gitops_repo: "https://github.com/maximilianoPizarro/nfl-wallet-gitops"
author: "Maximiliano Pizarro"
version: "2.0"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-seo-tag
  - jekyll-sitemap

brand:
  name: "Red Hat"
  primary: "#cc0000"
  text: "#151515"
  background: "#ffffff"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - "*.tgz"
